name: Build QGIS Plugin ZIP

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate plugin files
        run: |
          test -f PolygonMerging/__init__.py
          test -f PolygonMerging/metadata.txt
          test -f PolygonMerging/polygon_merging.py
      - name: Build ZIP
        run: |
          mkdir -p dist
          zip -r dist/PolygonMerging.zip PolygonMerging
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PolygonMerging
          path: dist/PolygonMerging.zip
          if-no-files-found: error
      - name: Attach ZIP to tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/PolygonMerging.zip
